name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check buildable contract crates
        run: |
          cargo check \
            -p callora-admin -p callora-allowlist -p callora-validators \
            -p callora-revenue-pool -p callora-storage-migration -p callora-batch-claim \
            -p callora-distribute -p callora-cold -p callora-emergency -p errors \
            -p callora-escrow -p callora-fee -p callora-freeze -p callora-helpers \
            -p callora-hot -p callora-limits -p callora-recipient -p callora-registry \
            -p callora-refund -p callora-rescue -p callora-stake -p callora-topics \
            -p callora-upgrade -p callora-yield
